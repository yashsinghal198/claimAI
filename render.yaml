services:
  - type: web
    name: claimai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd python && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
